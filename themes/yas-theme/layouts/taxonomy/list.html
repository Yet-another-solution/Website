{{ define "main" }}
<div class="yas-page-canvas">
<div class="yas-panel">
<div class="yas-panel-inner">

  <div class="yas-panel-header">
    <h1 class="yas-panel-title">{{ .Title }}</h1>
    <p class="mt-2 mb-0" style="color: var(--main-dark-text-color); font-size: 0.9rem;">Browse content by {{ .Data.Singular }}</p>
  </div>

  <div class="taxonomies-list">
    {{ range .Data.Terms.Alphabetical }}
      <div class="taxonomy-item mb-3">
        <h2 style="font-size: 1.2rem;">
          <a href="{{ .Page.Permalink }}" style="color: var(--main-dark-color); text-decoration: none;">{{ .Page.Title }}</a>
          <span style="color: var(--main-dark-text-color); font-size: 0.9rem;">({{ .Count }})</span>
        </h2>
        {{ if .Page.Content }}
          <div class="taxonomy-description" style="color: var(--main-light-text-color);">{{ .Page.Content | truncate 200 }}</div>
        {{ end }}
      </div>
    {{ end }}
  </div>

</div>
</div>
</div>
{{ end }}
